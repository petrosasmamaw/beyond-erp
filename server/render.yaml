services:
  - type: web
    name: beyond-solution-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build && npm run db:migrate-payment
    healthCheckPath: /health
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
