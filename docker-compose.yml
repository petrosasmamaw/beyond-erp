services:
  postgres:
    image: postgres:16-alpine
    container_name: beyond-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beyond_erp
    ports:
      - "5432:5432"
    volumes:
      - beyond_erp_pgdata:/var/lib/postgresql/data

volumes:
  beyond_erp_pgdata:
